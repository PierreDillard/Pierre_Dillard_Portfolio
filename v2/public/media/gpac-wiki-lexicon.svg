<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Parcours du lexique interactif GPAC</title><desc id="desc">Un mot-clé rencontré dans une page ouvre une définition contextuelle, montre ses alias et mène aux pages de tags.</desc><rect width="1200" height="600" fill="#11212b"/><g font-family="Arial,sans-serif"><text x="64" y="78" fill="#eb9b84" font-size="18" letter-spacing="4">WIKI GPAC / EXPÉRIENCE DE LECTURE</text><text x="64" y="143" fill="#f4f4ed" font-size="45" font-weight="700">Un mot. Une définition. Un chemin.</text><rect x="64" y="210" width="470" height="290" rx="12" fill="#f1f0ea"/><text x="94" y="255" fill="#59646a" font-size="15" font-weight="700">PAGE DE DOCUMENTATION</text><text x="94" y="310" fill="#15232b" font-size="24">Le pipeline contient plusieurs</text><rect x="95" y="328" width="126" height="40" rx="7" fill="#e9a08c"/><text x="106" y="355" fill="#18242a" font-size="22" font-weight="700">filtres</text><text x="233" y="355" fill="#15232b" font-size="24">reliés entre eux.</text><text x="94" y="440" fill="#6b7475" font-size="16">Le terme devient un point d’entrée.</text><path d="M535 346H625" stroke="#ed9a86" stroke-width="3"/><path d="m612 336 15 10-15 10" fill="none" stroke="#ed9a86" stroke-width="3"/><rect x="635" y="210" width="500" height="290" rx="12" fill="#233d48" stroke="#759199"/><text x="670" y="253" fill="#e0a391" font-size="15" font-weight="700">DÉFINITION CONTEXTUELLE</text><text x="670" y="309" fill="#fff" font-size="34" font-weight="700">Filtre</text><text x="670" y="351" fill="#d7e2e1" font-size="18">Une étape du graphe de traitement GPAC.</text><text x="670" y="394" fill="#afc5c8" font-size="16">Alias et termes associés</text><text x="670" y="458" fill="#f1ab99" font-size="18" font-weight="700">Voir les pages liées ↗</text><text x="64" y="554" fill="#9eb5bc" font-size="14">Illustration éditoriale du parcours ; les comportements et leur statut sont documentés dans les sources.</text></g></svg>
