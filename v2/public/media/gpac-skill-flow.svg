<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc"><title id="title">Workflow de recherche GPAC</title><desc id="desc">Question, recherche dans les sources, niveau de preuve et réponse traçable.</desc><rect width="1200" height="620" fill="#111e27"/><g stroke="#4a626c" fill="none"><path d="M120 340H1080"/><path d="M367 340V210H580"/><path d="M747 340V460H925"/></g><g font-family="Arial,sans-serif"><text x="70" y="86" fill="#e98e78" font-size="19" letter-spacing="5">GPAC / RECHERCHE GUIDÉE</text><text x="70" y="150" fill="#f2f1e9" font-size="44" font-weight="700">De la question à la preuve.</text><g font-size="17" fill="#a9bdc1"><text x="70" y="555">Un exemple historique reste une piste ; une recette validée porte sa preuve.</text></g><g fill="#20343d" stroke="#68818a"><rect x="70" y="290" width="215" height="105" rx="8"/><rect x="340" y="290" width="215" height="105" rx="8"/><rect x="610" y="290" width="215" height="105" rx="8"/><rect x="880" y="290" width="215" height="105" rx="8"/></g><g fill="#f5f4ef" font-size="22" font-weight="700"><text x="95" y="352">01 / Question</text><text x="365" y="352">02 / Sources</text><text x="635" y="352">03 / Contrôle</text><text x="905" y="352">04 / Réponse</text></g><g fill="#aec2c5" font-size="15"><text x="365" y="376">Corpus · aide · code</text><text x="635" y="376">Recette ou observation ?</text><text x="905" y="376">Avec provenance</text></g></g></svg>
